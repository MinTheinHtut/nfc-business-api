# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Vite app to Azure Web App - nfc-business-web

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/main_nfc-business-web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://nfc-business-api-c3gwhab7brh4hnfh.japaneast-01.azurewebsites.net
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f frontend/dist/index.html
          test -f frontend/server.js
          test -f frontend/package.json
          test -d frontend/node_modules

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r frontend/dist deploy/dist
          cp frontend/server.js deploy/server.js
          cp frontend/package.json deploy/package.json
          cp frontend/package-lock.json deploy/package-lock.json
          cp -r frontend/node_modules deploy/node_modules

      - name: Upload frontend deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download frontend deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nfc-business-web'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_16A1ED9C0FFC45059CB881BBBD1FA74A }}
